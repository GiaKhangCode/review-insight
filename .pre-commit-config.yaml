# Git hooks run automatically on `git commit` (install once: `uv run pre-commit install`).
# CI runs the same hooks with `uv run pre-commit run --all-files`, so local == CI.
# Update pinned versions with `uv run pre-commit autoupdate`.

repos:
  # 1. Secret scanning: block API keys / tokens before they ever enter git history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # 2. Generic hygiene checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]   # datasets and model files do not belong in git
      - id: detect-private-key

  # 3. Lint + format. Version matches ruff in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
