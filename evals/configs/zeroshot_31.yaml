# Config 1 (SPEC §7.1): zero-shot, gemini-3.1-flash-lite.
# Run: uv run python -m evals.run --config evals/configs/zeroshot_31.yaml --split dev_100
# Identical to zeroshot_35.yaml except for the model: one variable changes per comparison.

name: zeroshot_31
analyzer: gemini
seed: 42 # unused by the LLM (no sampling control on newer models); kept for the record

gemini:
  model: gemini-3.1-flash-lite
  prompt: prompts/analyze_v1.yaml
  min_interval_s: 5.0 # 12 RPM, under the 15 RPM free-tier limit (docs/GEMINI.md)
